<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Tempik — Disposable Inbox</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23FACC15' stroke='%2318181B' stroke-width='4'/%3E%3Ctext x='32' y='46' font-family='sans-serif' font-size='38' font-weight='900' fill='%2318181B' text-anchor='middle'%3ET%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app">
      <header>
        <h1 id="appTitle">Tempik</h1>
        <p id="appSubtitle">⚡ Disposable Inbox di Edge Cloudflare</p>
      </header>

      <section class="toolbar">
        <select id="inboxSelect"></select>
        <button id="copyBtn">
          <svg class="ico-svg" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          Salin
        </button>
        <button id="refreshBtn">
          <svg class="ico-svg" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
          Refresh
        </button>
        <button id="newBtn">
          <svg class="ico-svg" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Baru
        </button>
        <button id="deleteBtn" class="danger">
          <svg class="ico-svg" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          Hapus
        </button>
      </section>

      <section class="new-box hidden" id="newBox">
        <input id="localPartInput" placeholder="username atau kosongkan untuk acak" />
        <select id="domainSelect"></select>
        <button id="createCustomBtn">
          <svg class="ico-svg" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
          Buat
        </button>
        <button id="createRandomBtn">
          <svg class="ico-svg" viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 8h.01"/><path d="M8 8h.01"/><path d="M8 16h.01"/><path d="M16 16h.01"/><path d="M12 12h.01"/></svg>
          Acak
        </button>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2 id="currentInbox">Belum ada inbox dipilih</h2>
          <span id="messageCount">0 pesan</span>
        </div>
        <div id="messageList" class="message-list"></div>
      </section>

      <footer>
        <a href="https://github.com/haerubirru17/tempik" target="_blank" rel="noopener">
          Powered by <b>Tempik</b> · <span>haerubirru17</span>
        </a>
      </footer>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="/app.js"></script>
  </body>
</html>
