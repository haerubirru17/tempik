<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Tempik — Disposable Inbox</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23FACC15' stroke='%2318181B' stroke-width='4'/%3E%3Ctext x='32' y='46' font-family='sans-serif' font-size='38' font-weight='900' fill='%2318181B' text-anchor='middle'%3ET%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app">
      <header>
        <h1 id="appTitle">Tempik</h1>
        <p id="appSubtitle">⚡ Disposable Inbox di Edge Cloudflare</p>
      </header>

      <section class="toolbar">
        <select id="inboxSelect"></select>
        <button id="copyBtn">📋 Copy</button>
        <button id="refreshBtn">🔄 Refresh</button>
        <button id="newBtn">＋ New</button>
        <button id="deleteBtn" class="danger">🗑 Delete</button>
      </section>

      <section class="new-box hidden" id="newBox">
        <input id="localPartInput" placeholder="username atau kosongkan untuk acak" />
        <select id="domainSelect"></select>
        <button id="createCustomBtn">✦ Create</button>
        <button id="createRandomBtn">🎲 Random</button>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2 id="currentInbox">Belum ada inbox dipilih</h2>
          <span id="messageCount">0 pesan</span>
        </div>
        <div id="messageList" class="message-list"></div>
      </section>

      <footer>
        <a href="https://github.com/haerubirru17/tempik" target="_blank" rel="noopener">
          Powered by <b>Tempik</b> · <span>haerubirru17</span>
        </a>
      </footer>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="/app.js"></script>
  </body>
</html>
